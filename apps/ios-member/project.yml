name: FitnessMember
options:
  bundleIdPrefix: de.gymtaro
  deploymentTarget:
    iOS: "17.0"

configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

targets:
  FitnessMember:
    type: application
    platform: iOS
    sources:
      - FitnessMember
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.gymtaro.member
        PRODUCT_NAME: FitnessMember
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ZJP24W38LQ
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_NSCameraUsageDescription: "gymodo braucht die Kamera, um den QR-Code am Gerät oder am Studioeingang zu scannen."
        # INFOPLIST_KEY_<Key> deckt bei GENERATE_INFOPLIST_FILE nur Apples
        # bekannte Info.plist-Schluessel ab (z.B. NSCameraUsageDescription).
        # Fuer eigene Schluessel (SUPABASE_URL etc.) wird laut Apple-Doku eine
        # separate Info.plist-Datei per INFOPLIST_FILE in die generierte
        # Info.plist eingemischt (siehe FitnessMember/Info-Additions.plist).
        INFOPLIST_FILE: FitnessMember/Info-Additions.plist
    dependencies:
      - package: Supabase
        product: Auth
      - package: Supabase
        product: Supabase
    entitlements:
      path: FitnessMember/FitnessMember.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:gymodo-web.vercel.app

  FitnessMemberTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FitnessMemberTests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ZJP24W38LQ
    dependencies:
      - target: FitnessMember

schemes:
  FitnessMember:
    build:
      targets:
        FitnessMember: all
        FitnessMemberTests: [test]
    test:
      targets:
        - FitnessMemberTests
    run:
      config: Debug
