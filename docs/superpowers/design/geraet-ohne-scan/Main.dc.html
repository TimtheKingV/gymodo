<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0A0B0D; font-family: Archivo, -apple-system, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #D4FF3F; } a:hover { color: #E8FF8A; }
    .ph { width: 393px; height: 852px; background: #0A0B0D; color: #F2F4F7; display: flex; flex-direction: column; overflow: hidden; }
    .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #9BA3AF; }
    .weg { height: 60px; border-radius: 16px; border: 1px solid #2A2E36; color: #F2F4F7; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; flex: none; }
    .tabs { flex: none; height: 78px; border-top: 1px solid #2A2E36; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-top: 11px; }
    .tab { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; color: #5C636E; }
    .tab.on { color: #D4FF3F; }
  </style>
</helmet>

<div class="ph">
  <div style="height: 54px; flex: none"></div>

  <div style="flex: none; padding: 14px 20px 0">
    <div style="font-size: 32px; font-weight: 900; letter-spacing: -.03em; text-transform: uppercase; line-height: 1">Training</div>
  </div>

  <!-- Platzhalter fuer das Foto eines echten Aufklebers. Bis dahin die
       Marke, die auf dem Aufkleber steht: QR und NFC in einem Zeichen --
       genau die beiden Wege, die darunter als Knopf stehen. -->
  <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 0 32px">
    <div style="width: 200px; height: 200px; border-radius: 16px; background: #14161A; border: 1px solid #2A2E36; display: flex; align-items: center; justify-content: center">
      <svg width="132" height="68" viewBox="0 0 120 62" fill="none">
        <g stroke="#F2F4F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="20" height="20" rx="4.5"/>
          <rect x="37" y="3" width="20" height="20" rx="4.5"/>
          <rect x="3" y="37" width="20" height="20" rx="4.5"/>
          <path d="M37 37h9v9"/>
          <path d="M57 57h-9v-9"/>
        </g>
        <g transform="translate(58,-6) scale(3)" stroke="#D4FF3F" stroke-width="0.72" stroke-linecap="round" fill="none">
          <path d="M7.5 8.5a5 5 0 0 1 0 7"/>
          <path d="M11.5 5.5a10 10 0 0 1 0 13"/>
          <path d="M15.5 2.5a15 15 0 0 1 0 19"/>
        </g>
      </svg>
    </div>
  </div>

  <div style="flex: none; padding: 0 20px 16px; display: flex; flex-direction: column; gap: 12px">

    <div class="weg">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#F2F4F7" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><path d="M13.5 13.5h3v3"/><path d="M20.5 20.5h-3v-3"/></svg>
      QR-Code scannen
    </div>

    <div class="weg">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#F2F4F7" stroke-width="2" stroke-linecap="round"><path d="M7.5 8.5a5 5 0 0 1 0 7"/><path d="M11.5 5.5a10 10 0 0 1 0 13"/><path d="M15.5 2.5a15 15 0 0 1 0 19"/></svg>
      NFC-Tag scannen
    </div>

    <!-- Der dritte Weg, gleichwertig: gleiche Form, gleiche Hoehe, gleiche
         Kontur. Die eine Akzentflaeche des Screens bleibt frei. -->
    <div class="weg">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#F2F4F7" stroke-width="2" stroke-linecap="round"><path d="M8.5 6.5h12M8.5 12h12M8.5 17.5h12M3.7 6.5h.01M3.7 12h.01M3.7 17.5h.01"/></svg>
      Aus der Liste wählen
    </div>

  </div>

  <div class="tabs">
    <div class="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
      Home
    </div>
    <div class="tab on">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6M7.5 6.5v11M16.5 6.5v11M20 9v6M7.5 12h9"/></svg>
      Training
    </div>
    <div class="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5.2" width="17" height="15.3" rx="2.6"/><path d="M8 3v4M16 3v4M3.5 10.2h17"/></svg>
      Kurse
    </div>
    <div class="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M4.8 20c0-3.5 3.3-5.8 7.2-5.8s7.2 2.3 7.2 5.8"/></svg>
      Profil
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
