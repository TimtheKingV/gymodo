<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap">
  <style>
    body { margin: 0; background: #0A0B0D; font-family: Archivo, -apple-system, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #D4FF3F; } a:hover { color: #E8FF8A; }
    .ph { width: 393px; height: 852px; background: #0A0B0D; color: #F2F4F7; display: flex; flex-direction: column; overflow: hidden; }
    .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #9BA3AF; }
    .num { font-variant-numeric: tabular-nums; font-weight: 900; letter-spacing: -.03em; }
    .tabs { flex: none; height: 78px; border-top: 1px solid #2A2E36; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-top: 11px; }
    .tab { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; color: #5C636E; }
    .tab.on { color: #D4FF3F; }
  </style>
</helmet>

<div class="ph">
  <div style="height: 54px; flex: none"></div>

  <div style="flex: none; height: 44px; padding: 0 16px; display: flex; align-items: center; gap: 12px">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F2F4F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 5-7 7 7 7"/></svg>
    <span class="eyebrow">Beinpresse · Beidbeinig</span>
  </div>

  <!-- Resttimer -->
  <div style="flex: none; margin: 10px 20px 0; background: #14161A; border: 1px solid #2A2E36; border-radius: 16px; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 13px">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <span class="eyebrow" style="color: #D4FF3F">Pause · 90 s</span>
      <span class="num" style="font-size: 42px; line-height: 1">01:12</span>
    </div>
    <div style="height: 7px; border-radius: 4px; background: #2A2E36; overflow: hidden">
      <div style="width: 80%; height: 100%; background: #D4FF3F"></div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 12px; color: #5C636E">Läuft weiter, auch wenn du wegsiehst.</span>
      <span style="font-size: 13px; font-weight: 700; color: #9BA3AF">+30 s</span>
    </div>
  </div>

  <!-- Gerade gesichert -->
  <div style="flex: none; padding: 20px 20px 0; display: flex; flex-direction: column; gap: 11px">
    <div class="eyebrow">Dieser Block · 1 Satz</div>
    <div style="background: #14161A; border: 1px solid #2A2E36; border-radius: 12px; padding: 13px 15px; display: flex; align-items: center; gap: 12px">
      <div style="width: 28px; height: 28px; border-radius: 8px; background: #1D2026; display: flex; align-items: center; justify-content: center; flex: none">
        <span class="num" style="font-size: 13px; color: #9BA3AF">1</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 5px; flex-grow: 1">
        <span class="num" style="font-size: 20px">80,0</span>
        <span style="font-size: 12px; font-weight: 700; color: #9BA3AF">kg</span>
        <span class="num" style="font-size: 20px; margin-left: 5px">× 10</span>
        <span style="font-size: 12px; font-weight: 700; color: #5C636E; margin-left: 6px">RIR 2</span>
      </div>
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#D4FF3F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
    </div>
  </div>

  <div style="flex-grow: 1"></div>

  <!-- Hauptaktion + Ausstiege -->
  <div style="flex: none; padding: 0 20px 14px; display: flex; flex-direction: column; gap: 10px">
    <div style="height: 64px; border-radius: 16px; background: #D4FF3F; color: #0A0B0D; display: flex; align-items: center; justify-content: center; gap: 10px">
      <span style="font-size: 19px; font-weight: 800">Satz 2</span>
      <span style="width: 4px; height: 4px; border-radius: 50%; background: #0A0B0D; opacity: .5"></span>
      <span class="num" style="font-size: 19px; font-weight: 900">80,0 kg</span>
    </div>
    <div style="display: flex; gap: 10px">
      <div style="flex-grow: 1; height: 46px; border-radius: 14px; border: 1px solid #2A2E36; color: #F2F4F7; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center">Gewicht ändern</div>
      <div style="flex-grow: 1; height: 46px; border-radius: 14px; border: 1px solid #2A2E36; color: #F2F4F7; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center">Übung wechseln</div>
    </div>
    <div style="height: 46px; display: flex; align-items: center; justify-content: center; gap: 8px; color: #9BA3AF">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H6"/><path d="m11.5 6-6 6 6 6"/></svg>
      <span style="font-size: 15px; font-weight: 600">Zurück zum Training</span>
    </div>
  </div>

  <div class="tabs">
    <div class="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
      Home
    </div>
    <div class="tab on">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6M7.5 6.5v11M16.5 6.5v11M20 9v6M7.5 12h9"/></svg>
      Training
    </div>
    <div class="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5.2" width="17" height="15.3" rx="2.6"/><path d="M8 3v4M16 3v4M3.5 10.2h17"/></svg>
      Kurse
    </div>
    <div class="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M4.8 20c0-3.5 3.3-5.8 7.2-5.8s7.2 2.3 7.2 5.8"/></svg>
      Profil
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
