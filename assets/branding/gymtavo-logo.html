    #gymtavo-logo-concept {
      --gt-ink: #0A0B0D;
      --gt-paper: #F2F4F7;
      --gt-volt: #D4FF3F;
      display: grid;
      gap: 12px;
      width: 100%;
      margin: 0;
      background: transparent;
      font-family: Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #gymtavo-logo-concept * { box-sizing: border-box; }

    #gymtavo-logo-concept .gt-panel {
      container-type: inline-size;
      padding: 24px clamp(20px, 5%, 48px);
    }

    #gymtavo-logo-concept .gt-dark {
      background: var(--gt-ink);
      color: var(--gt-paper);
    }

    #gymtavo-logo-concept .gt-light {
      background: var(--gt-paper);
      color: var(--gt-ink);
    }

    #gymtavo-logo-concept .gt-caption {
      margin: 0;
      color: #9BA3AF;
      font: 500 11px/1.4 Arial, sans-serif;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    #gymtavo-logo-concept .gt-light .gt-caption { color: #5C636E; }

    #gymtavo-logo-concept .gt-stage {
      display: grid;
      place-items: center;
      padding: clamp(48px, 10cqi, 104px) 0;
    }

    #gymtavo-logo-concept .gt-logo {
      display: inline-flex;
      align-items: baseline;
      gap: .111111em;
      color: inherit;
      font-family: 'GYMTAVO Archivo', Archivo, Arial, sans-serif;
      font-size: clamp(38px, 16.5cqi, 160px);
      font-style: normal;
      font-weight: 900;
      font-synthesis: none;
      font-kerning: normal;
      line-height: 1;
      white-space: nowrap;
    }

    #gymtavo-logo-concept .gt-word { letter-spacing: -.05em; }

    #gymtavo-logo-concept .gt-dot {
      display: inline-block;
      flex: 0 0 .259259em;
      width: .259259em;
      height: .259259em;
      border-radius: 50%;
      background: var(--gt-volt);
    }

    @media print {
      #gymtavo-logo-concept { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      #gymtavo-logo-concept .gt-panel { break-inside: avoid; }
    }
  </style>
