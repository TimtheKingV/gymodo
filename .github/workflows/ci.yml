name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # supabase/config.toml loest site_url, additional_redirect_urls und zwei
      # Mail-Einstellungen ueber env() auf -- damit ein Push gegen die Cloud
      # nicht die Site-URL des Projekts auf localhost setzt. "supabase start"
      # liest diese Werte aus .env, und .env ist gitignoriert. Ohne die Kopie
      # bricht der Start mit "failed to read config: CliConfigParseError" ab.
      #
      # Bewusst .env.example und keine Wiederholung der Werte im Workflow:
      # sonst driften zwei Listen auseinander. Die echten Schluessel fuer die
      # Integrationstests kommen weiter aus den Secrets unten -- eine echte
      # Shell-Variable hat Vorrang vor .env.
      - run: cp .env.example .env
      - run: pnpm exec supabase start
      - run: pnpm test:integration
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: ${{ secrets.LOCAL_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LOCAL_SERVICE_ROLE_KEY }}

      # Der Bau ist der einzige Schritt, der ein node:crypto im Client-Bundle
      # findet -- typecheck sieht es nicht. Die Fachschicht liefert TS-Quellen
      # aus, und das Barrel zieht ueber tags.ts das Modul mit; genau deshalb
      # gibt es @fitretro/domain/media und /tag-scan als Unterpfade.
      #
      # NEXT_PUBLIC_* werden hier ins Bundle eingesetzt, nicht zur Laufzeit
      # gelesen. Sie muessen deshalb schon beim Bau stimmen, sonst spricht der
      # Browser im E2E-Lauf gegen eine Platzhalteradresse.
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.LOCAL_ANON_KEY }}

      - run: pnpm exec playwright install --with-deps chromium

      # Laeuft gegen den Bau von oben, nicht gegen den Dev-Server -- siehe die
      # Begruendung in playwright.config.ts. Chromium genuegt: geprueft wird
      # die Anwendung, nicht die Browservielfalt.
      - run: pnpm test:e2e
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: ${{ secrets.LOCAL_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LOCAL_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.LOCAL_ANON_KEY }}

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-bericht
          path: |
            playwright-report/
            test-results/
          retention-days: 7
